<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DineIQ Analytics</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#7b8497;--line:#e8ebf2;--blue:#4f46e5;--teal:#11b5a4;--orange:#f59e0b;--red:#ef476f;--green:#16a34a}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,Arial;color:var(--ink)}.app{display:flex;min-height:100vh}.side{width:244px;background:#131a2b;color:#b8c0d2;padding:24px 14px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:800;color:white;padding:0 13px 30px}.brand span{color:#7c79ff}.small{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:#6d7890;padding:0 13px 10px}.nav button{width:100%;border:0;background:none;color:inherit;text-align:left;padding:12px 13px;border-radius:9px;margin:2px 0;cursor:pointer;font-size:13px}.nav button.active,.nav button:hover{background:#272e49;color:white}.main{margin-left:244px;width:calc(100% - 244px);padding:25px 30px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{color:var(--blue);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:1px}.title{font-size:26px;font-weight:800;margin-top:5px}.actions{display:flex;gap:10px;align-items:center}.select,.btn{border:1px solid var(--line);background:white;padding:10px 13px;border-radius:8px;color:#46506a}.btn{cursor:pointer}.primary{background:var(--blue);color:white;border-color:var(--blue)}.page{display:none}.page.active{display:block}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 2px 8px #16254a06}.metric{font-size:25px;font-weight:800;margin:10px 0 4px}.label{color:var(--muted);font-size:12px}.delta{font-size:12px;color:var(--green)}.row{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:18px}.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:18px}.card h3{font-size:15px;margin:0 0 16px}.chart{height:190px;display:flex;align-items:end;gap:10px;padding:15px 8px 5px;border-bottom:1px solid var(--line)}.bar{flex:1;background:linear-gradient(180deg,#716eff,#b0afff);border-radius:5px 5px 0 0;min-height:12px;position:relative}.bar.teal{background:linear-gradient(180deg,#13b7a6,#9ce8df)}.bar.orange{background:linear-gradient(180deg,#f7ad24,#ffe0a1)}.bar i{position:absolute;bottom:-22px;font-style:normal;font-size:10px;color:var(--muted);left:50%;transform:translateX(-50%)}.list{display:flex;flex-direction:column;gap:13px}.item{display:flex;justify-content:space-between;align-items:center}.tag{padding:5px 8px;border-radius:20px;font-size:11px;font-weight:700}.green{background:#e6f7ed;color:#15803d}.yellow{background:#fff4d6;color:#a16207}.pink{background:#ffe7ee;color:#be123c}.purple{background:#ecebff;color:#5149d7}.progress{height:7px;background:#edf0f6;border-radius:9px;margin-top:7px;overflow:hidden}.progress b{display:block;height:100%;background:var(--blue);border-radius:9px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{text-align:left;padding:12px 7px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-weight:600}.pill{display:inline-block;padding:5px 9px;border-radius:15px;background:#f0efff;color:var(--blue);font-size:11px}.notice{padding:12px;background:#fff8e8;border-left:3px solid var(--orange);border-radius:7px;color:#825d11;margin-bottom:12px}.filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}@media(max-width:900px){.side{width:190px}.main{margin-left:190px;width:calc(100% - 190px)}.grid{grid-template-columns:repeat(2,1fr)}.row,.row3{grid-template-columns:1fr}}@media(max-width:600px){.side{position:static;width:100%;height:auto}.app{display:block}.main{margin:0;width:100%;padding:18px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid{grid-template-columns:1fr 1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Dine<span>IQ</span> <small>Analytics</small></div><div class="small">Workspace</div><div class="nav"><button class="active" data-page="executive">▦ &nbsp; Executive Overview</button><button data-page="menu">◈ &nbsp; Menu Intelligence</button><button data-page="customers">♙ &nbsp; Customer Intelligence</button><button data-page="wastage">♨ &nbsp; Wastage Intelligence</button><button data-page="forecast">⌁ &nbsp; Demand Forecast</button><button data-page="dual">⇄ &nbsp; Dual-Pipeline Compare</button></div><div class="small" style="margin-top:28px">Tools</div><div class="nav"><button data-page="whatif">⚙ &nbsp; What-if Simulator</button><button data-page="quality">✓ &nbsp; Data Quality</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">Restaurant intelligence platform</div><div class="title" id="pageTitle">Executive Overview</div></div><div class="actions"><select class="select"><option>All locations</option><option>Clifton</option><option>DHA</option><option>Gulshan</option></select><select class="select"><option>Last 30 days</option><option>Last 90 days</option><option>This year</option></select><button class="btn primary">Export report</button></div></div>
<div id="pages"></div></main></div><script>
const bar=(vals,cls='')=>`<div class="chart">${vals.map((v,i)=>`<div class="bar ${cls}" style="height:${v}%"><i>${['W1','W2','W3','W4','W5','W6','W7'][i]||i+1}</i></div>`).join('')}</div>`;
const k=(a,b,c,d)=>`<div class="grid">${[[a,'↗ 12.4%','vs previous period'],[b,'↗ 8.1%','vs previous period'],[c,'↗ 5.6%','vs previous period'],[d,'↘ 3.2%','needs attention']].map(x=>`<div class="card"><div class="label">${x[2]}</div><div class="metric">${x[0]}</div><div class="delta">${x[1]}</div></div>`).join('')}</div>`;
const table=(rows,heads)=>`<table class="table"><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
let common=`<div class="filters"><button class="btn">Date range ▾</button><button class="btn">Location ▾</button><button class="btn">Channel ▾</button><button class="btn">Category ▾</button></div>`;
const pages={executive:`${k('$428.6K','$96.2K','18,492','1,284 kg')}<div class="row"><div class="card"><h3>Revenue & order trend</h3>${bar([42,56,48,70,64,82,91])}</div><div class="card"><h3>Business health</h3><div class="list"><div class="item"><span>Gross margin</span><b>22.4%</b></div><div class="progress"><b style="width:72%"></b></div><div class="item"><span>Repeat customer rate</span><b>38.6%</b></div><div class="progress"><b style="width:61%"></b></div><div class="item"><span>Forecast attainment</span><b>91.2%</b></div><div class="progress"><b style="width:91%"></b></div></div></div></div><div class="row3"><div class="card"><h3>Critical recommendations</h3><div class="notice">Reduce prep for Chicken Alfredo — high wastage risk.</div><div class="notice">Review discount on Combo 3 — margin trap detected.</div></div><div class="card"><h3>Top locations</h3>${table([['Clifton','$142K','24.8%'],['DHA','$118K','21.4%'],['Gulshan','$97K','19.7%']],['Location','Revenue','Margin'])}</div><div class="card"><h3>Live alerts</h3><div class="list"><div class="item"><span>Sales anomaly</span><span class="tag pink">3 open</span></div><div class="item"><span>Wastage risk</span><span class="tag yellow">8 items</span></div><div class="item"><span>Data quality</span><span class="tag green">98.4%</span></div></div></div></div>`,
menu:`${common}${k('42','18','11','7')}<div class="row"><div class="card"><h3>Menu portfolio matrix</h3>${table([['Truffle Pasta','Profit Driver','$18.4K','31.2%','4.8','Low'],['Chicken Biryani','Volume Driver','$24.1K','16.9%','4.5','Med'],['Miso Bowl','Hidden Opportunity','$6.2K','34.5%','4.7','Low'],['Alfredo Pasta','Low Performer','$3.1K','8.2%','3.8','High']],['Item','Classification','Revenue','Margin','Rating','Wastage'])}</div><div class="card"><h3>Category revenue</h3>${bar([83,64,52,42,31],'teal')}</div></div><div class="card"><h3>Menu insights</h3><div class="row3"><div><span class="tag green">PROFIT DRIVER</span><p>Truffle Pasta has high margin, strong rating and low waste.</p></div><div><span class="tag purple">HIDDEN OPPORTUNITY</span><p>Miso Bowl should be promoted to increase discovery.</p></div><div><span class="tag pink">SLOW MOVING</span><p>Alfredo Pasta has 12-day purchase gaps and high waste.</p></div></div></div>`,
customers:`${common}${k('12,840','38.6%','1,482','2,116')}<div class="row"><div class="card"><h3>Customer segment distribution</h3>${bar([86,68,54,42,32,22],'teal')}</div><div class="card"><h3>RFM health</h3>${table([['High-value loyal','3,420','26.6%','$142'],['Frequent','2,850','22.2%','$98'],['Promotion-driven','2,116','16.5%','$61'],['At-risk','1,482','11.5%','$47']],['Segment','Customers','Share','Avg order'])}</div></div><div class="card"><h3>Customer movement</h3>${bar([35,48,43,66,58,78,84])}</div>`,
wastage:`${common}${k('1,284 kg','$18.6K','8','14.2%')}<div class="row"><div class="card"><h3>Wastage trend</h3>${bar([78,67,72,58,61,49,43],'orange')}</div><div class="card"><h3>Risk prediction</h3>${table([['Chicken Alfredo','High','92 kg','Prepare -25%'],['Garden Salad','High','68 kg','Prepare -20%'],['Miso Bowl','Medium','41 kg','Monitor'],['Biryani','Low','18 kg','Maintain']],['Item','Risk','30d est.','Action'])}</div></div><div class="card"><h3>Wastage by location</h3>${table([['Clifton','412 kg','$6,120','7.8%'],['DHA','386 kg','$5,440','8.4%'],['Gulshan','291 kg','$4,220','9.1%']],['Location','Quantity','Cost','Rate'])}</div>`,
forecast:`${common}${k('24,680','23,910','3.1%','12')}<div class="row"><div class="card"><h3>Historical vs forecast demand</h3>${bar([34,45,43,57,52,69,65],'teal')}</div><div class="card"><h3>Forecast quality</h3><div class="metric">91.8%</div><div class="label">Model confidence</div><div class="progress"><b style="width:92%"></b></div><p>MAE 142 · RMSE 218 · MAPE 6.4%</p><span class="tag green">Within target</span></div></div><div class="card"><h3>High-risk demand periods</h3>${table([['Fri 7–9 PM','Clifton','+38%','Stock up'],['Sat 1–3 PM','DHA','+24%','Stock up'],['Mon 2–4 PM','Gulshan','-19%','Reduce prep']],['Period','Location','Expected change','Recommendation'])}</div>`,
dual:`${common}${k('94.7%','142','7','0.8%')}<div class="row"><div class="card"><h3>Agreement by analytical task</h3>${bar([95,91,87,96],'teal')}</div><div class="card"><h3>Pipeline status</h3><div class="list"><div class="item"><span>Apache Spark / MLlib</span><span class="tag green">Complete</span></div><div class="item"><span>Python / Scikit-learn</span><span class="tag green">Complete</span></div><div class="item"><span>Last run</span><b>Today 09:42</b></div></div></div></div><div class="card"><h3>Record-level verification</h3>${table([['M042','Profit Driver','Profit Driver','MATCH','0.0'],['M017','Volume Driver','Hidden Opportunity','MISMATCH','0.42'],['C8821','High-value','High-value','MATCH','0.0'],['M091','Low Performer','Low Performer','MATCH','0.0']],['Record ID','Spark result','Python result','Status','Difference'])}</div>`,
whatif:`<div class="card"><h3>Scenario simulator <span class="tag yellow">ESTIMATE ONLY</span></h3><p class="label">Change assumptions and estimate business impact. Actual results are not changed.</p><div class="row3"><label>Menu item<select class="select" style="display:block;width:100%;margin-top:8px"><option>Truffle Pasta</option><option>Chicken Biryani</option></select></label><label>Price change<input class="select" style="display:block;width:100%;margin-top:8px" value="+5%"></label><label>Prep quantity<input class="select" style="display:block;width:100%;margin-top:8px" value="-10%"></label></div><button class="btn primary" onclick="alert('Scenario calculated: estimated margin +2.8%, wastage -8.4%')">Run scenario</button></div><br>${k('$447.2K','$101.8K','+4.2%','1,176 kg')}<div class="card"><h3>Estimated impact vs current baseline</h3>${table([['Revenue','+$18.6K','+4.3%','Positive'],['Contribution margin','+$5.6K','+5.8%','Positive'],['Demand','-2.1%','-','Monitor'],['Wastage','-108 kg','-8.4%','Positive']],['Indicator','Change','Rate','Assessment'])}</div>`,
quality:`${k('98.4%','1,248','34','99.1%')}<div class="row"><div class="card"><h3>Data quality dimensions</h3>${bar([99,97,98,94,96,99],'teal')}</div><div class="card"><h3>Validation rules</h3>${table([['Missing IDs','0.2%','Passed'],['Duplicate orders','0.5%','Review'],['Invalid prices','0.1%','Passed'],['Negative quantity','0.3%','Quarantined']],['Rule','Issue rate','Status'])}</div></div>`};
const titles={executive:'Executive Overview',menu:'Menu Intelligence',customers:'Customer Intelligence',wastage:'Wastage Intelligence',forecast:'Demand Forecast',dual:'Dual-Pipeline Compare',whatif:'What-if Simulator',quality:'Data Quality'};
for(const [id,html] of Object.entries(pages)){let d=document.createElement('section');d.id=id;d.className='page '+(id==='executive'?'active':'');d.innerHTML=html;document.getElementById('pages').appendChild(d)}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(b.dataset.page).classList.add('active');document.getElementById('pageTitle').textContent=titles[b.dataset.page]});
</script></body></html>
